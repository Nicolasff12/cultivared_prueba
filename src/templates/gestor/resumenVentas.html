{% extends 'base.html' %}
{% block body %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<!-- Navbar con estilo -->
<nav class="navbar sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="/CULTIVARED" class="logo" title="CultivaRed"><span class="li">Cultiva</span>Red</a>  
        <a  href="javascript:history.back()"  class="btn btn-outline-light">
            <i class="bi bi-arrow-left-circle"></i> Atrás</a>
        </a>
    </div>
</nav>

<!-- Contenido principal -->
<div class="container py-5">
    <h2 class="text-center mb-5">📊 Resumen del {{user[6]}}</h2>

    <div class="row g-4 justify-content-center">

        <!-- Total de Ventas -->
        <div class="col-md-4">
            <div class="card text-white bg-primary border-0 shadow h-100">
                <div class="card-body text-center">
                    <i class="bi bi-cash-coin display-4 mb-3"></i>
                    <h5 class="card-title">Total de {{user[6]}}</h5>
                    <p class="card-text fs-3 fw-bold">${{ '%.2f'|format(resumen.total_ganancias) }}</p>
                </div>
            </div>
        </div>

        <!-- Producto Más Vendido -->
        <div class="col-md-4">
            <div class="card text-white bg-success border-0 shadow h-100">
                <div class="card-body text-center">
                    <i class="bi bi-box-seam display-4 mb-3"></i>
                    <h5 class="card-title">Producto Más {{user[6]}}</h5>
                    <p class="card-text fs-4 fw-bold">{{ resumen.producto_mas_vendido }}</p>
                </div>
            </div>
        </div>

        <!-- Ventas Realizadas -->
        <div class="col-md-4">
            <div class="card text-white bg-info border-0 shadow h-100">
                <div class="card-body text-center">
                    <i class="bi bi-bar-chart-fill display-4 mb-3"></i>
                    <h5 class="card-title">{{user[6]}} Realizadas</h5>
                    <p class="card-text fs-3 fw-bold">{{ resumen.total_productos }}</p>
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
